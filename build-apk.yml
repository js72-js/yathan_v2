name: Construire l'APK YATHAN

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Vérifier les fichiers du dépôt
        run: |
          ls -la
          ok=1
          for f in package.json capacitor.config.json www/index.html resources/android-res.zip; do
            if [ ! -f "$f" ]; then
              echo "::error::Fichier manquant à la racine du dépôt : $f"
              ok=0
            fi
          done
          [ "$ok" = "1" ]

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Vérifier le SDK Android
        run: |
          echo "SDK Android : $ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: |
          rm -rf android
          npx cap add android
          unzip -o resources/android-res.zip -d android/app/src/main/res
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../yathan.apk

      - name: Mettre l'APK dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: yathan-apk
          path: yathan.apk

      - name: Publier l'APK dans les Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YATHAN 1.0.${{ github.run_number }}
          files: yathan.apk
